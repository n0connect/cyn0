name: Build Multi-Platform

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - name: Show available Qt packages (Windows)
        run: |
          python -m pip install --upgrade pip aqtinstall
          python -m aqt list-qt windows desktop 6.9.2 --arch win64_msvc2019_64 || python -m aqt list-qt windows desktop 6.9.2

      - name: Install Qt (with fallback)
        run: |
          python -m pip install --upgrade pip aqtinstall
          python -m aqt install-qt windows desktop 6.9.2 win64_msvc2019_64 --outputdir $RUNNER_TEMP/Qt ^
          || python -m aqt install-qt windows desktop 6.6.3 win64_msvc2019_64 --outputdir $RUNNER_TEMP/Qt

      - name: Add Qt bin to PATH
        run: echo "$RUNNER_TEMP/Qt/6.9.2/win64_msvc2019_64/bin" >> $GITHUB_PATH || true

      - name: Build
        run: |
          qmake Cyn0.pro
          nmake

      - name: Package
        run: |
          mkdir release-package
          copy release\Cyn0.exe release-package\ || echo "Executable not found"
          if exist "%RUNNER_TEMP%\Qt\6.9.2\win64_msvc2019_64\bin\windeployqt.exe" (
            "%RUNNER_TEMP%\Qt\6.9.2\win64_msvc2019_64\bin\windeployqt.exe" release-package\Cyn0.exe || echo "windeployqt failed"
          ) else (
            echo "windeployqt not found"
          )

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cyn0-Windows-x64
          path: release-package/

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Qt (mac)
        run: |
          python3 -m pip install --upgrade pip aqtinstall
          python3 -m aqt install-qt mac desktop 6.9.2 clang_64 --outputdir $RUNNER_TEMP/Qt \
          || python3 -m aqt install-qt mac desktop 6.6.3 clang_64 --outputdir $RUNNER_TEMP/Qt

      - name: Add Qt bin to PATH (mac)
        run: echo "$RUNNER_TEMP/Qt/6.9.2/clang_64/bin" >> $GITHUB_PATH || true

      - name: Build
        run: |
          qmake Cyn0.pro
          make

      - name: Create DMG
        run: |
          if command -v macdeployqt &> /dev/null; then
            macdeployqt Cyn0.app -dmg || echo "macdeployqt failed"
          else
            echo "macdeployqt not found"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cyn0-macOS
          path: Cyn0.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Dependencies (system)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libx11-dev \
            libxkbcommon-x11-dev \
            python3-pip \
            libxcb1 \
            libxcb-cursor0 \
            libxcb-xinerama0 \
            libx11-xcb-dev \
            libxcb-render0-dev \
            libxcb-shape0 \
            libxcb-shm0

      - name: Show available Qt packages (Linux)
        run: |
          python3 -m pip install --upgrade pip aqtinstall
          python3 -m aqt list-qt linux desktop 6.9.2 --arch gcc_64 || python3 -m aqt list-qt linux desktop 6.9.2

      - name: Install Qt (with fallback)
        run: |
          python3 -m aqt install-qt linux desktop 6.9.2 gcc_64 --outputdir $RUNNER_TEMP/Qt \
          || python3 -m aqt install-qt linux desktop 6.6.3 gcc_64 --outputdir $RUNNER_TEMP/Qt

      - name: Add Qt bin to PATH (linux)
        run: echo "$RUNNER_TEMP/Qt/6.9.2/gcc_64/bin" >> $GITHUB_PATH || true

      - name: Build
        run: |
          qmake Cyn0.pro
          make

      - name: Create AppImage
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O linuxdeploy
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage -O linuxdeploy-plugin-qt
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          if [ -f Cyn0 ]; then
            ./linuxdeploy --appdir AppDir --executable Cyn0 --plugin qt --output appimage || echo "linuxdeploy failed"
          else
            echo "Cyn0 executable not found; skipping linuxdeploy"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cyn0-Linux-x86_64
          path: Cyn0-*.AppImage

  create-release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Cyn0-Windows-x64/**/*
            Cyn0-macOS/**/*
            Cyn0-Linux-x86_64/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

