name: Build Multi-Platform

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          cache: true

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        run: |
          qmake Cyn0.pro CONFIG+=release
          nmake

      - name: Package
        run: |
          mkdir release-package
          if exist release\Cyn0.exe (
            copy release\Cyn0.exe release-package\
            windeployqt release-package\Cyn0.exe --release --no-translations
          ) else (
            echo "Executable not found"
            dir /s Cyn0.exe
          )
        shell: cmd

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cyn0-Windows-x64
          path: release-package/

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          host: 'mac'
          target: 'desktop'
          cache: true

      - name: Build
        run: |
          qmake Cyn0.pro CONFIG+=release
          make

      - name: Create DMG
        run: |
          macdeployqt Cyn0.app -dmg

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cyn0-macOS
          path: Cyn0.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Dependencies (system)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libx11-dev \
            libxkbcommon-x11-dev \
            libxcb-keysyms1-dev \
            libxcb-icccm4-dev \
            libxcb1-dev \
            libxcb-cursor0 \
            libxcb-cursor-dev \
            libxcb-xinerama0 \
            libx11-xcb-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-shm0-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          host: 'linux'
          target: 'desktop'
          cache: true

      - name: Build
        run: |
          qmake Cyn0.pro CONFIG+=release
          make

      - name: Prepare AppImage
        run: |
          # Create desktop file with icon
          cat > Cyn0.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=Cyn0
          Exec=Cyn0
          Icon=Cyn0
          Categories=Utility;Security;
          Terminal=false
          EOF
          
          # Install ImageMagick for icon resize
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick
          
          # Resize icon to 512x512 (max size for linuxdeploy)
          mkdir -p .icon-tmp
          convert icons/devilSearch.png -resize 512x512 .icon-tmp/Cyn0.png
          
          # Make executable
          chmod +x Cyn0

      - name: Create AppImage
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O linuxdeploy
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage -O linuxdeploy-plugin-qt
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          
          # Set Qt paths from iqta
          export QMAKE=$(which qmake)
          export QT_PLUGIN_PATH=$Qt6_DIR/plugins
          
          if [ -f Cyn0 ]; then
            echo "QMAKE path: $QMAKE"
            ./linuxdeploy --appdir AppDir --executable Cyn0 --desktop-file Cyn0.desktop --icon-file .icon-tmp/Cyn0.png --plugin qt --output appimage
          else
            echo "Cyn0 executable not found"
            ls -la
            exit 1
          fi

      - name: Rename AppImage
        run: |
          if [ -f Cyn0-*.AppImage ]; then
            mv Cyn0-*.AppImage Cyn0-Linux-x86_64.AppImage
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cyn0-Linux-x86_64
          path: Cyn0-Linux-x86_64.AppImage

  create-release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: List downloaded files
        run: |
          echo "Downloaded artifacts:"
          ls -R

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Cyn0-Windows-x64/*
            Cyn0-macOS/*
            Cyn0-Linux-x86_64/*
          fail_on_unmatched_files: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

