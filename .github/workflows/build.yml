name: Build Multi-Platform

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Qt
        run: |
          python -m pip install --upgrade pip aqtinstall
          python -m aqt install-qt windows desktop 6.7.3 win64_msvc2019_64 --outputdir $env:RUNNER_TEMP/Qt
        shell: pwsh

      - name: Add Qt bin to PATH
        run: |
          echo "$env:RUNNER_TEMP\Qt\6.7.3\win64_msvc2019_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Build
        run: |
          qmake Cyn0.pro "CONFIG+=release"
          nmake release
        shell: cmd

      - name: Package
        run: |
          mkdir release-package
          if exist release\Cyn0.exe (
            copy release\Cyn0.exe release-package\
            "%RUNNER_TEMP%\Qt\6.7.3\win64_msvc2019_64\bin\windeployqt.exe" release-package\Cyn0.exe --release --no-translations || echo "windeployqt failed"
          ) else if exist debug\Cyn0.exe (
            copy debug\Cyn0.exe release-package\
            "%RUNNER_TEMP%\Qt\6.7.3\win64_msvc2019_64\bin\windeployqt.exe" release-package\Cyn0.exe --debug --no-translations || echo "windeployqt failed"
          ) else (
            echo "Executable not found in release or debug folder"
            dir /s Cyn0.exe
          )
        shell: cmd

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cyn0-Windows-x64
          path: release-package/

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Qt (mac)
        run: |
          python3 -m pip install --upgrade pip aqtinstall
          python3 -m aqt install-qt mac desktop 6.7.3 clang_64 --outputdir $RUNNER_TEMP/Qt

      - name: Add Qt bin to PATH (mac)
        run: echo "$RUNNER_TEMP/Qt/6.7.3/clang_64/bin" >> $GITHUB_PATH

      - name: Build
        run: |
          qmake Cyn0.pro "CONFIG+=release"
          make

      - name: Create DMG
        run: |
          if [ -f "$RUNNER_TEMP/Qt/6.7.3/clang_64/bin/macdeployqt" ]; then
            "$RUNNER_TEMP/Qt/6.7.3/clang_64/bin/macdeployqt" Cyn0.app -dmg || echo "macdeployqt failed"
          else
            echo "macdeployqt not found, trying from PATH"
            macdeployqt Cyn0.app -dmg || echo "macdeployqt failed"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cyn0-macOS
          path: Cyn0.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Dependencies (system)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libx11-dev \
            libxkbcommon-x11-dev \
            libxcb-keysyms1-dev \
            libxcb-icccm4-dev \
            python3-pip \
            libxcb1-dev \
            libxcb-cursor0 \
            libxcb-cursor-dev \
            libxcb-xinerama0 \
            libx11-xcb-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-shm0-dev

      - name: Install Qt
        run: |
          python3 -m pip install --upgrade pip aqtinstall
          python3 -m aqt install-qt linux desktop 6.7.3 gcc_64 --outputdir $RUNNER_TEMP/Qt

      - name: Add Qt bin to PATH (linux)
        run: echo "$RUNNER_TEMP/Qt/6.7.3/gcc_64/bin" >> $GITHUB_PATH

      - name: Build
        run: |
          qmake Cyn0.pro "CONFIG+=release"
          make

      - name: Create AppImage
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O linuxdeploy
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage -O linuxdeploy-plugin-qt
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          if [ -f Cyn0 ]; then
            ./linuxdeploy --appdir AppDir --executable Cyn0 --plugin qt --output appimage || echo "linuxdeploy failed"
          else
            echo "Cyn0 executable not found; skipping linuxdeploy"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cyn0-Linux-x86_64
          path: Cyn0-*.AppImage

  create-release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Cyn0-Windows-x64/**/*
            Cyn0-macOS/**/*
            Cyn0-Linux-x86_64/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

