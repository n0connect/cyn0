name: Build Multi-Platform

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          cache: true

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        run: |
          qmake Cyn0.pro CONFIG+=release
          nmake

      - name: Package
        run: |
          mkdir release-package
          if exist release\Cyn0.exe (
            copy release\Cyn0.exe release-package\
            windeployqt release-package\Cyn0.exe --release --no-translations
          ) else (
            echo "Executable not found"
            dir /s Cyn0.exe
          )
        shell: cmd

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cyn0-Windows-x64
          path: release-package/

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          host: 'mac'
          target: 'desktop'
          cache: true

      - name: Build
        run: |
          qmake Cyn0.pro CONFIG+=release
          make

      - name: Create DMG
        run: |
          macdeployqt Cyn0.app -dmg

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cyn0-macOS
          path: Cyn0.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Dependencies (system)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libx11-dev \
            libxkbcommon-x11-dev \
            libxcb-keysyms1-dev \
            libxcb-icccm4-dev \
            libxcb1-dev \
            libxcb-cursor0 \
            libxcb-cursor-dev \
            libxcb-xinerama0 \
            libx11-xcb-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-shm0-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          host: 'linux'
          target: 'desktop'
          cache: true

      - name: Build
        run: |
          qmake Cyn0.pro CONFIG+=release
          make

      - name: Create AppImage
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O linuxdeploy
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage -O linuxdeploy-plugin-qt
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          if [ -f Cyn0 ]; then
            ./linuxdeploy --appdir AppDir --executable Cyn0 --plugin qt --output appimage || echo "linuxdeploy failed"
          else
            echo "Cyn0 executable not found; skipping linuxdeploy"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cyn0-Linux-x86_64
          path: Cyn0-*.AppImage

  create-release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Cyn0-Windows-x64/**/*
            Cyn0-macOS/**/*
            Cyn0-Linux-x86_64/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

