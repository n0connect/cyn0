name: Build Multi-Platform

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.9.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'

      - name: Build
        run: |
          qmake Cyn0.pro
          nmake

      - name: Package
        run: |
          mkdir release-package
          cp release/Cyn0.exe release-package/
          windeployqt release-package/Cyn0.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cyn0-Windows-x64
          path: release-package/

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.9.2'
          host: 'mac'
          target: 'desktop'

      - name: Build
        run: |
          qmake Cyn0.pro
          make

      - name: Create DMG
        run: |
          macdeployqt Cyn0.app -dmg

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cyn0-macOS
          path: Cyn0.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-x11-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.9.2'
          host: 'linux'
          target: 'desktop'

      - name: Build
        run: |
          qmake Cyn0.pro
          make

      - name: Create AppImage
        run: |
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --executable Cyn0 --plugin qt --output appimage

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cyn0-Linux-x86_64
          path: Cyn0-*.AppImage

  create-release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Cyn0-Windows-x64/**/*
            Cyn0-macOS/**/*
            Cyn0-Linux-x86_64/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
